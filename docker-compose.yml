services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts:/scripts:ro,z
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - ark_network

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_NAME=Project A.R.K.
      - ENABLE_CODE_EXECUTION=true
    volumes:
      - open-webui_data:/app/backend/data
    networks:
      - ark_network
    depends_on:
      ollama:
        condition: service_healthy

  skills:
    build: ./skills
    container_name: skills
    restart: unless-stopped
    ports:
      - "8001:8000"
    networks:
      - ark_network

  proxy:
    image: docker.io/library/nginx:alpine
    container_name: proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./certs:/etc/nginx/certs:ro,z
    networks:
      - ark_network
    depends_on:
      - open-webui

volumes:
  ollama_data:
  open-webui_data:

networks:
  ark_network:
    driver: bridge
