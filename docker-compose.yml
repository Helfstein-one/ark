services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts:/scripts:ro
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - ark_network

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_NAME=Project A.R.K.
      - ENABLE_CODE_EXECUTION=true
    volumes:
      - open-webui_data:/app/backend/data
    networks:
      - ark_network
    depends_on:
      ollama:
        condition: service_healthy

  skills:
    build: ./skills
    container_name: skills
    restart: unless-stopped
    ports:
      - "8001:8000"
    networks:
      - ark_network

volumes:
  ollama_data:
  open-webui_data:

networks:
  ark_network:
    driver: bridge
