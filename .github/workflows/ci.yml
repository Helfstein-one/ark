name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest requests
        if [ -f skills/requirements.txt ]; then pip install -r skills/requirements.txt; fi

    - name: Lint with flake8
      run: |
        flake8 skills/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 skills/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Generate SSL Certificates
      run: |
        chmod +x scripts/generate-certs.sh
        ./scripts/generate-certs.sh

    - name: Start Docker Compose
      run: |
        docker compose up -d
        sleep 30 # Wait for services to start up

    - name: Test with pytest
      run: |
        pytest tests/
